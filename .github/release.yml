# Builds standalone binaries for Windows, macOS and Linux and attaches them to
# a GitHub release.
#
# Move this to .github/workflows/release.yml to activate it — see .github/README.md.
# It runs when a v* tag is pushed, or on demand from the Actions tab.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            asset: jaigent-linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            label: linux-arm64
            asset: jaigent-linux-arm64
            archive: tar.gz
          - os: macos-13
            label: macos-x64
            asset: jaigent-macos-x64
            archive: tar.gz
          - os: macos-latest
            label: macos-arm64
            asset: jaigent-macos-arm64
            archive: tar.gz
          - os: windows-latest
            label: windows-x64
            asset: jaigent-windows-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller packaging/jaigent.spec --clean --noconfirm

      - name: Smoke test the binary (unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/jaigent --version
          ./dist/jaigent route "hello"
          ./dist/jaigent models --only openai

      - name: Smoke test the binary (windows)
        if: runner.os == 'Windows'
        run: |
          .\dist\jaigent.exe --version
          .\dist\jaigent.exe route "hello"
          .\dist\jaigent.exe models --only openai

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf ../${{ matrix.asset }}.tar.gz jaigent
          cd ..
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\jaigent.exe -DestinationPath ${{ matrix.asset }}.zip
          (Get-FileHash ${{ matrix.asset }}.zip -Algorithm SHA256).Hash.ToLower() +
            "  ${{ matrix.asset }}.zip" | Out-File -Encoding ascii ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  wheel:
    name: python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  publish:
    name: publish release
    needs: [build, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' \) \
            -exec cp {} release/ \;
          cat artifacts/*/*.sha256 > release/checksums.txt
          ls -la release/
          cat release/checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" release/* \
            --title "$TAG" \
            --generate-notes \
            --verify-tag || gh release upload "$TAG" release/* --clobber
