name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys — `jaigent config` masks them for you.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ jaigent "..."
        Expected: ...
        Got: ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Output of `jaigent config`
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: jaigent version
      placeholder: "0.1.0 (jaigent --version)"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12.4, macOS 14"
    validations:
      required: true
